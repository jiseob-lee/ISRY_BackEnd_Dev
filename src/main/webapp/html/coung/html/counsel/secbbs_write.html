<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="사이버1388, 사이버 상담, 1388, 청소년 상담, 사이버 상담, 웹 심리검사, 온라인 부모교육, 게시판 상담, 고민 상담">
	<meta name="author" content="KYCI">

	<title>사이버1388 청소년상담센터</title>

	<link rel="stylesheet" href="../../css/xeicon.min.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/style.css">

	<script type="text/javascript" src="../../js/jquery/jquery-3.5.1.min.js"></script>
	<script type="text/javascript" src="../../js/common.js"></script>
	<script type="text/javascript" src="../../js/depth.js"></script>

	<script>
		$(function(){
			$("#l-lnb").load("../../inc/inc_lnb.html", function(){depthLnb(3,4);});
			$("#l-title").load("../../inc/inc_title.html", function(){depthTitle(3,4);});
		});
	</script>
</head>
<body>
<div class="wrap">

	<!-- Skip to content-->
	<div id="skip">
		<!-- /inc/inc_skip.html -->
	</div>
	<!--// Skip to content -->

	<!-- header -->
	<header id="l-header">
		<!-- /inc/inc_header.html -->
	</header>
	<!--// header -->

	<!-- l-container -->
	<div id="l-container">
		<div class="l-container--inner">

			<div id="l-lnb">
				<!-- /inc/inc_lnb.html -->
			</div>
			<!-- //lnb -->

			<div id="l-contents">

				<div id="l-title">
					<!-- /inc/inc_title.html -->
				</div>
				<!-- //l-title -->

				<div class="l-contents">

					<div class="c-title__sub">
						<h4 class="title__sub">게시판상담실 글쓰기</h4>
					</div>
					<!-- //c-title__sub -->

					<div class="c-board__write-02">

						<div class="form__group">
							<div class="form__tr">
								<div class="form__th"><label for="form-name">작성자</label></div>
								<div class="form__td">
									<input type="text" id="form-name" class="txt w-300" value="작성자">
								</div>
							</div>
							<!-- //form__tr -->
						</div>
						<!-- //form__group -->

						<div class="form__group">
							<div class="form__tr">
								<div class="form__th"><label for="form-email">이메일</label></div>
								<div class="form__td">
									<input type="text" id="form-email" class="txt w-300" value="email@gmail.com">
								</div>
							</div>
							<!-- //form__tr -->
						</div>
						<!-- //form__group -->

						<div class="form__group">
							<div class="form__tr">
								<div class="form__th"><label for="form-job">직업</label></div>
								<div class="form__td">
									<div class="type-radio">
										<label><input type="radio" name="form-job" id="form-job"><span>학생</span></label>
										<label><input type="radio" name="form-job"><span>학업중단</span></label>
										<label><input type="radio" name="form-job"><span>무직</span></label>
										<label><input type="radio" name="form-job"><span>근로</span></label>
										<label><input type="radio" name="form-job"><span>미취학 청소년</span></label>
										<label><input type="radio" name="form-job"><span>학부모</span></label>
										<label><input type="radio" name="form-job"><span>지도자</span></label>
										<label><input type="radio" name="form-job"><span>일반인</span></label>
										<label><input type="radio" name="form-job"><span>기타</span></label>
									</div>
								</div>
							</div>
							<!-- //form__tr -->
						</div>
						<!-- //form__group -->

						<div class="form__group">
							<div class="form__tr">
								<div class="form__th"><label for="form-school">현재학력<br>(해당자)</label></div>
								<div class="form__td">
									<select name="form-school" id="form-school" style="width:auto;">
										<option value="">선택</option>
										<option value="">초등학교</option>
										<option value="">중학교</option>
										<option value="">고등학교</option>
										<option value="">대학교</option>
									</select>
									<select name="form-school" id="" style="width:auto;">
										<option value="">선택</option>
										<option value="">1</option>
										<option value="">2</option>
										<option value="">3</option>
										<option value="">4</option>
										<option value="">5</option>
										<option value="">6</option>
									</select>
									학년
								</div>
							</div>
							<!-- //form__tr -->
						</div>
						<!-- //form__group -->

						<div class="form__group">
							<div class="form__tr">
								<div class="form__th"><label for="form-counselor">상담영역</label></div>
								<div class="form__td">
									<div class="type-radio">
										<label><input type="radio" name="form-counselor" id="form-counselor"><span>가족</span></label>
										<label><input type="radio" name="form-counselor"><span>비행</span></label>
										<label><input type="radio" name="form-counselor"><span>학업/학교부적응</span></label>
										<label><input type="radio" name="form-counselor"><span>진로</span></label>
										<label><input type="radio" name="form-counselor"><span>성</span></label>
										<label><input type="radio" name="form-counselor"><span>성격</span></label>
										<label><input type="radio" name="form-counselor"><span>대인관계</span></label>
										<label><input type="radio" name="form-counselor"><span>정신건강</span></label>
										<label><input type="radio" name="form-counselor"><span>생활습관/태도</span></label>
										<label><input type="radio" name="form-counselor"><span>컴퓨터/인터넷사용</span></label>
										<label><input type="radio" name="form-counselor"><span>정보제공</span></label>
										<label><input type="radio" name="form-counselor"><span>근로</span></label>
										<label><input type="radio" name="form-counselor"><span>기타</span></label>
									</div>
								</div>
							</div>
							<!-- //form__tr -->
						</div>
						<!-- //form__group -->

						<div class="form__group">
							<div class="form__tr">
								<div class="form__th"><label for="form-subject">제목</label></div>
								<div class="form__td">
									<input type="text" id="form-subject" class="txt w-full" value="고민입니다.">
									<span class="txt__desc">※ 비방, 욕설증의 불량단어 입력시 등록이 되지 않으니 유의하시기 바랍니다.</span>
								</div>
							</div>
							<!-- //form__tr -->
						</div>
						<!-- //form__group -->

						<div class="form__group">
							<div class="form__tr">
								<div class="form__th"><label for="form-content">내용</label></div>
								<div class="form__td">
									<p class="txt__limit"><span id="textlimit">4000</span> / 4000byte(약2000자미만 입력가능)</p>
									<textarea name="form-content" id="form-content" cols="30" rows="10" title="글내용 입력폼"></textarea>
								</div>
							</div>
							<!-- //form__tr -->
						</div>
						<!-- //form__group -->

						<div class="form__group">
							<div class="form__tr">
								<div class="form__th"><label for="form-sms">답변 알림<br> 문자서비스</label></div>
								<div class="form__td">
									<p>
										<label><input type="radio" name="form-sms" id="form-sms"><span>희망</span></label>
										(번호 : <input type="text" class="txt w-200" value="01012345678"> )
									</p>
									<p><label><input type="radio" name="form-sms"><span>희망하지 않음</span></label></p>
								</div>
							</div>
							<!-- //form__tr -->
						</div>
						<!-- //form__group -->

					</div>
					<!-- //c-board__write-02 -->

					<div class="c-btns">
						<a href="javascript:void(0);" class="c-btn__dft btn--nor">저장하기</a>
					</div>
					<!-- //c-btns -->

				</div>
				<!-- //l-contents -->

			</div>
			<!-- //contents -->

		</div>
		<!-- //l-container--inner -->
	</div>
	<!-- //l-container -->

	<!-- footer -->
	<footer id="footer">
		<!-- /inc/inc_footer.html -->
	</footer>
	<!-- //footer -->

</div>
<!-- //wrap -->
</body>
</html>
