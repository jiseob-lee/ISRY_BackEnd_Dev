<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="사이버1388, 사이버 상담, 1388, 청소년 상담, 사이버 상담, 웹 심리검사, 온라인 부모교육, 게시판 상담, 고민 상담">
	<meta name="author" content="KYCI">

	<title>사이버1388 청소년상담센터</title>

	<link rel="stylesheet" href="../../css/xeicon.min.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/style.css">

	<script type="text/javascript" src="../../js/jquery/jquery-3.5.1.min.js"></script>
	<script type="text/javascript" src="../../js/common.js"></script>
	<script type="text/javascript" src="../../js/depth.js"></script>

	<script>
		$(function(){
			$("#l-lnb").load("../../inc/inc_lnb.html", function(){depthLnb(2,5);});
			$("#l-title").load("../../inc/inc_title.html", function(){depthTitle(2,5);});
		});
	</script>
</head>
<body>
<div class="wrap">

	<!-- Skip to content-->
	<div id="skip">
		<!-- /inc/inc_skip.html -->
	</div>
	<!--// Skip to content -->

	<!-- header -->
	<header id="l-header">
		<!-- /inc/inc_header.html -->
	</header>
	<!--// header -->

	<!-- l-container -->
	<div id="l-container">
		<div class="l-container--inner">

			<div id="l-lnb">
				<!-- /inc/inc_lnb.html -->
			</div>
			<!-- //lnb -->

			<div id="l-contents">

				<div id="l-title">
					<!-- /inc/inc_title.html -->
				</div>
				<!-- //l-title -->

				<div class="l-contents">

					<div class="c-board__write">
						<form action="">
							<table>
								<caption>글쓰기</caption>
								<colgroup>
									<col style="width:120px;">
									<col style="width:100px;">
									<col>
								</colgroup>
								<tbody>
									<tr>
										<th scope="row"><label for="txtName"><span class="bu__requier">*</span>신청자</label></th>
										<td colspan="2"><input type="text" id="txtName" name="txtName" class="txt w-normal" value="">
									</tr>
									<tr>
										<th scope="row"><label for="txtCompany"><span class="bu__requier">*</span>신청 기관명</label></th>
										<td colspan="2"><input type="text" id="txtCompany" name="txtCompany" class="txt w-normal" value=""></td>
									</tr>
									<tr>
										<th scope="row"><label for="txtMail"><span class="bu__requier">*</span>이메일</label></th>
										<td colspan="2"><input type="text" name="txtMail" id="txtMail" class="txt w-normal" value=""></td>
									</tr>
									<tr>
										<th scope="row" rowspan="2">연락처</th>
										<th><span class="bu__requier">*</span>기관</th>
										<td><input type="text" id="companyTel" name="companyTel" class="txt w-middle" value=""></td>
									</tr>
									<tr>
										<th>핸드폰</th>
										<td><input type="text" id="phone" name="phone" class="txt w-middle" value=""></td>
									</tr>
									<tr>
										<th scope="row"><label for="grouping"><span class="bu__requier">*</span>신청구분</label></th>
										<td colspan="2">
											<div class="c-set__chk--col">
												<label><input type="checkbox" name="gubun" value=""><span>홈페이지 링크</span></label>
											</div>
											<div class="c-set__chk--col">
												<label><input type="checkbox" name="gubun" value=""><span>웹심리검사 링크</span></label>
											</div>
											<div class="c-set__chk--col">
												<label><input type="checkbox" name="gubun" value=""><span>기타</span></label> <input type="text" name="gubunEtc" id="gubunEtc" value="" class="txt w-middle " disabled>
											</div>
										</td>
									</tr>
									<th scope="row"><label for="contents"><span class="bu__requier">*</span>요청사유</label></th>
										<td colspan="2">
											<p class="txt__limit"><span id="textlimit">4000</span> / 4000byte(약2000자미만 입력가능)</p>
											<textarea name="contents" id="contents" cols="30" rows="10"></textarea>
										</td>
									</tr>
								</tbody>
							</table>
						</form>
					</div>
					<!-- //board__write -->

					<div class="c-btns">
						<a href="javascript:void(0);" class="c-btn__dft btn--nor">저장하기</a>
					</div>
					<!-- //c-btns  -->

				</div>
				<!-- //l-contents -->

			</div>
			<!-- //contents -->

		</div>
		<!-- //l-container--inner -->
	</div>
	<!-- //l-container -->

	<!-- footer -->
	<footer id="footer">
		<!-- /inc/inc_footer.html -->
	</footer>
	<!-- //footer -->

</div>
<!-- //wrap -->
</body>
</html>
