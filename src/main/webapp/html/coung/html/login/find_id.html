<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="사이버1388, 사이버 상담, 1388, 청소년 상담, 사이버 상담, 웹 심리검사, 온라인 부모교육, 게시판 상담, 고민 상담">
	<meta name="author" content="KYCI">

	<title>사이버1388 청소년상담센터</title>

	<link rel="stylesheet" href="../../css/xeicon.min.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/style.css">

	<script type="text/javascript" src="../../js/jquery/jquery-3.5.1.min.js"></script>
	<script type="text/javascript" src="../../js/common.js"></script>
	<script type="text/javascript" src="../../js/depth.js"></script>
</head>
<body>
<div class="wrap">

	<!-- Skip to content-->
	<div id="skip">
		<!-- /inc/inc_skip.html -->
	</div>
	<!--// Skip to content -->

	<!-- header -->
	<header id="l-header">
		<!-- /inc/inc_header.html -->
	</header>
	<!--// header -->

	<!-- l-container -->
	<div id="l-container">
		<div class="l-container--inner">

			<div id="l-contents">

				<div class="l-contents">

					<div class="l-loginbox">

						<div class="c-login--title type--icon">
							<h2>아이디 찾기</h2>
							<p class="txt__sub">※ 아이디를 찾기위해 <strong>성명, 생년월일, 이메일</strong>을 입력하여 주세요.</p>
						</div>
						<!-- //c-login--title -->

						<form action="">
							<div class="c-form__login">

								<div class="c-form__login--input">
									<label for="form-login-name">성명</label>
									<input type="text" id="form-login-name" class="txt" placeholder="이름을 입력하세요.">
								</div>
								<!-- //c-form__login--input -->

								<div class="c-form__login--input">
									<label for="form-login-birthday">생년월일</label>
									<input type="text" id="form-login-birthday" class="txt" placeholder="생년월일을 입력하세요. 예) 1980-03-05">
								</div>
								<!-- //c-form__login--input -->

								<div class="c-form__login--input">
									<label for="form-login-email">이메일</label>
									<input type="text" id="form-login-email" class="txt" placeholder="이메일을 입력하세요 (회원정보에 등록한 이메일 주소)">
								</div>
								<!-- //c-form__login--input -->

								<div class="c-btns">
									<a href="javascript:void(0);" class="c-btn__large btn--nor w-full">확인</a>
								</div>
								<!-- //c-btns -->

								<div class="c-form__login--members">
									<a href="javascript:void(0);" title="로그인 페이지로 이동">로그인</a>
									<span>｜</span>
									<a href="javascript:void(0);" title="회원가입 페이지로 이동">회원가입</a>
									<span>｜</span>
									<a href="javascript:void(0);" title="비밀번호 찾기 페이지로 이동">비밀번호 찾기</a>
								</div>
								<!-- //c-form__login--members -->
							</div>
							<!-- //c-form__login -->
						</form>

					</div>
					<!-- //loginbox -->

				</div>
				<!-- //l-contents -->

			</div>
			<!-- //contents -->

		</div>
		<!-- //l-container--inner -->
	</div>
	<!-- //l-container -->

	<!-- footer -->
	<footer id="footer">
		<!-- /inc/inc_footer.html -->
	</footer>
	<!-- //footer -->

</div>
<!-- //wrap -->
</body>
</html>
