<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="사이버1388, 사이버 상담, 1388, 청소년 상담, 사이버 상담, 웹 심리검사, 온라인 부모교육, 게시판 상담, 고민 상담">
	<meta name="author" content="KYCI">

	<title>사이버1388 청소년상담센터</title>

	<link rel="stylesheet" href="../../css/xeicon.min.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/style.css">

	<script type="text/javascript" src="../../js/jquery/jquery-3.5.1.min.js"></script>
	<script type="text/javascript" src="../../js/common.js"></script>
	<script type="text/javascript" src="../../js/depth.js"></script>

	<script>
		$(function(){
			$("#l-lnb").load("../../inc/inc_lnb.html", function(){depthLnb(7,1);});
			$("#l-title").load("../../inc/inc_title.html", function(){depthTitle(7,1,1);});
		});
	</script>
</head>
<body>
<div class="wrap">

	<!-- Skip to content-->
	<div id="skip">
		<!-- /inc/inc_skip.html -->
	</div>
	<!--// Skip to content -->

	<!-- header -->
	<header id="l-header">
		<!-- /inc/inc_header.html -->
	</header>
	<!--// header -->

	<!-- l-container -->
	<div id="l-container">
		<div class="l-container--inner">

			<div id="l-lnb">
				<!-- /inc/inc_lnb.html -->
			</div>
			<!-- //lnb -->

			<div id="l-contents">

				<div id="l-title">
					<!-- /inc/inc_title.html -->
				</div>
				<!-- //l-title -->

				<div class="l-contents">

					<form action="">
						<div class="c-board__write-02">

							<div class="form__group">
								<div class="form__tr">
									<div class="form__th"><label for="form-name">이름</label></div>
									<div class="form__td">
										<input type="text" id="form-name" class="txt w-middle">
										<p class="txt__desc-02">※ 중복된 이름과 생년월일이 존재하여 가입이 불가한 경우, 이름 옆에 숫자를 붙여주세요. 예)홍길동3</p>
									</div>
									<!-- //form__td -->
								</div>
								<!-- //form__tr -->
							</div>
							<!-- //form__group -->

							<div class="form__group">
								<div class="form__tr">
									<div class="form__th"><label for="form-birth">생년월일</label></div>
									<div class="form__td">
										<input type="text" id="form-birth" class="txt w-middle" placeholder="예)1990-01-01" value="">
										<p class="txt__desc-02">※ 생년월일을 달력에서 선택하거나 다음의 예시와 같은 형식으로 입력해주세요. 예)1990-01-01</p>
									</div>
									<!-- //form__td -->
								</div>
								<!-- //form__tr -->
							</div>
							<!-- //form__group -->

							<div class="form__group">
								<div class="form__tr">
									<div class="form__th"><label for="form-gender">성별</label></div>
									<div class="form__td">
										<div class="type-radio">
											<label><input type="radio" name="form-gender" id="form-gender"><span>남자</span></label>
											<label><input type="radio" name="form-gender" id="form-gender-02"><span>여자</span></label>
										</div>
										<!-- //type-radio -->
									</div>
								</div>
								<!-- //form__tr -->
							</div>
							<!-- //form__group -->

							<div class="form__group">
								<div class="form__tr">
									<div class="form__th"><label for="form-cellphone">휴대폰</label></div>
									<div class="form__td">
										<div class="c-set__inp--btn">
											<input type="text" id="form-cellphone" class="txt w-middle" value="">
											<button type="button" class="c-btn__dft btn--nor">인증번호받기</button>
										</div>
										<!-- //c-set__inp--btn -->
									</div>
								</div>
								<!-- //form__tr -->
							</div>
							<!-- //form__group -->

							<div class="form__group">
								<div class="form__tr">
									<div class="form__th"><label for="form-authentication">인증번호확인</label></div>
									<div class="form__td">
										<div class="c-set__inp--btn">
											<input type="text" id="form-authentication" class="txt w-middle" value="">
											<button type="button" class="c-btn__dft btn--nor">인증번호확인</button>
										</div>
										<!-- //c-set__inp--btn -->
									</div>
								</div>
								<!-- //form__tr -->
							</div>
							<!-- //form__group -->

							<div class="form__group">
								<div class="form__tr">
									<div class="form__th"><label for="form-email">이메일</label></div>
									<div class="form__td">
										<div class="form__email">
											<input type="text" id="form-email" value="" class="txt"><span class="txt__at">@</span>
											<input type="text" id="form-email-02" value="" class="txt">
											<select name="" id="form-email-03">
												<option value="">직접입력</option>
												<option value="">gmail.com</option>
											</select>
										</div>
										<!-- //form__email -->
									</div>
									<!-- //form__td -->
								</div>
								<!-- //form__tr -->
							</div>
							<!-- //form__group -->

						</div>
						<!-- //c-board__write-02 -->
					</form>

					<div class="c-btns">
						<div class="align-left">
							<a href="javascript:void(0);" class="c-btn__dft btn--nor">정보저장</a>
						</div>
						<!-- //align-left -->
					</div>
					<!-- //c-btns -->

				</div>
				<!-- //l-contents -->

			</div>
			<!-- //contents -->

		</div>
		<!-- //l-container--inner -->
	</div>
	<!-- //l-container -->

	<!-- footer -->
	<footer id="footer">
		<!-- /inc/inc_footer.html -->
	</footer>
	<!-- //footer -->

</div>
<!-- //wrap -->
</body>
</html>
