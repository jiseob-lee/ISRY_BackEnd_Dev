<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>여성가족부</title>
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="popUp find-id active" role="dialog">
    <div class="layer-wrap">
      <div class="head">
        <button class="btn_close js-btn-close" title="팝업 닫기"></button>
      </div>
      <div class="body">
        <h1 class="pop-tit">아이디 찾기</h1>
        <p class="para">아이디를 찾기 위해 등록한 휴대전화번호 또는<br> 
          이메일을 입력하여 주세요.</p>

          <div class="form_area">
            <div class="inp_box">
              <input type="text" class="name_inp inp-txt" placeholder="성명">
            </div>

            <div class="radio_area">
              <label class="rdo-custom" role="radio" for="B">휴대전화
                <input type="radio" id="B" name="type" value="B" aria-hidden="true">
                <span class="rdomark"></span>
              </label>
              <label class="rdo-custom" role="radio" for="C">이메일
                <input type="radio" id="C" name="type" value="C" checked aria-hidden="true">
                <span class="rdomark"></span>
              </label>
            </div>
            
            <div class="inp_box">
              <input type="text" class="contact_inp inp-txt" placeholder="이메일">
            </div>
          </div>
      </div>
      <div class="foot">
        <button class="btn js-btn-close">확<span class="space"></span>인</button>
      </div>
    </div>
  </div>

  <script src="js/jquery-3.5.1.min.js"></script>
  <script src="js/common_ui.js"></script>
</body>

</html>
