<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>여성가족부</title>
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="popUp find-pw active" role="dialog">
    <div class="layer-wrap">
      <div class="head">
        <button class="btn_close js-btn-close" title="팝업 닫기"></button>
      </div>
      <div class="body">
        <h1 class="pop-tit">비밀번호 찾기</h1>
        <p class="para">임시비밀전호 발급을 위하여 등록하신 아이디와 성명, 
          휴대전화번호 또는 이메일을 입력하여 주세요.</p>

          <div class="form_area">
            <div class="inp_area">
              <div class="inp_box">
                <input type="text" class="id_inp inp-txt" placeholder="아이디">
              </div>
              <div class="inp_box">
                <input type="text" class="name_inp inp-txt" placeholder="성명">
              </div>
            </div>

            <div class="radio_area">
              <label class="rdo-custom" for="D">휴대전화
                <input type="radio" id="D" name="type" value="D" checked>
                <span class="rdomark"></span>
              </label>
              <label class="rdo-custom" for="E">이메일
                <input type="radio" id="E" name="type" value="E">
                <span class="rdomark"></span>
              </label>
            </div>
            
            <div class="inp_box">
              <input type="text" class="contact_inp inp-txt" placeholder="휴대전화번호">
            </div>
          </div>
      </div>
      <div class="foot">
        <button class="btn js-btn-close">확<span class="space"></span>인</button>
      </div>
    </div>
  </div>
  <script src="js/jquery-3.5.1.min.js"></script>
  <script src="js/common_ui.js"></script>
</body>

</html>
