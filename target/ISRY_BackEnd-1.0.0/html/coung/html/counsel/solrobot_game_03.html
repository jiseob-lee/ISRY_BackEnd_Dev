<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="사이버1388, 사이버 상담, 1388, 청소년 상담, 사이버 상담, 웹 심리검사, 온라인 부모교육, 게시판 상담, 고민 상담">
	<meta name="author" content="KYCI">

	<title>사이버1388 청소년상담센터</title>

	<link rel="stylesheet" href="../../css/xeicon.min.css">
	<link rel="stylesheet" href="../../css/common.css">
	<link rel="stylesheet" href="../../css/style.css">

	<script type="text/javascript" src="../../js/jquery/jquery-3.5.1.min.js"></script>
	<script type="text/javascript" src="../../js/common.js"></script>
	<script type="text/javascript" src="../../js/depth.js"></script>

	<script>
		$(function(){
			$("#l-lnb").load("../../inc/inc_lnb.html", function(){depthLnb(3,1);});
			$("#l-title").load("../../inc/inc_title.html", function(){
				depthTitle(3,1);
				extraTitle("normal","대인관계 - 친구를 사귀고 싶어요.");
			});
		});
	</script>
</head>
<body>
<div class="wrap">

	<!-- Skip to content-->
	<div id="skip">
		<!-- /inc/inc_skip.html -->
	</div>
	<!--// Skip to content -->

	<!-- header -->
	<header id="l-header">
		<!-- /inc/inc_header.html -->
	</header>
	<!--// header -->

	<!-- l-container -->
	<div id="l-container">
		<div class="l-container--inner">

			<div id="l-lnb">
				<!-- /inc/inc_lnb.html -->
			</div>
			<!-- //lnb -->

			<div id="l-contents">

				<div id="l-title">
					<!-- /inc/inc_title.html -->
				</div>
				<!-- //l-title -->

				<div id="visual" class="solrobot">
					<dl>
						<dt>솔로봇 상담</dt>
						<dd>솔로봇상담은 게임 또는 영상을 통해 고민을 가진 등장인물(또는 <br>캐릭터)이 되어보고, 가상의 상담자(도담쌤)와 함께 고민을 해결하는 곳입니다.</dd>
					</dl>
				</div>
				<!-- //visual -->

				<div class="l-contents">

					<div class="c-title__sub">
						<h4 class="title__sub">설정변경</h4>
						<div class="align-right">
							<button type="button" class="c-btn__arr--down" title="설정 열기" aria-btn-set><span class="hide">열기</span></button>
						</div>
						<!-- //align-right -->
					</div>
					<!-- //c-title__sub -->

					<div class="c-board__write-02" aria-game-set>
						<div class="form__group form__flex type-game">
							<div class="form__tr tr-1">
								<!-- 230, 230, 160 -->
								<div class="form__th">글씨속도</div>
								<div class="form__td">
									<div class="c-set__radio--txt-02">
										<label><input type="radio" name="gameset-01"><span>빠름</span></label>
										<label><input type="radio" name="gameset-01" checked><span>보통</span></label>
										<label><input type="radio" name="gameset-01"><span>느림</span></label>
									</div>
									<!-- //c-set__radio--txt-02-->
								</div>
							</div>
							<!-- //form__tr -->
							<div class="form__tr tr-1">
								<div class="form__th">글씨크기</div>
								<div class="form__td">
									<div class="c-set__radio--txt-02">
										<label><input type="radio" name="gameset-02"><span>크게</span></label>
										<label><input type="radio" name="gameset-02" checked><span>보통</span></label>
										<label><input type="radio" name="gameset-02"><span>작게</span></label>
									</div>
									<!-- //c-set__radio--txt-02-->
								</div>
							</div>
							<!-- //form__tr -->
							<div class="form__tr tr-2">
								<div class="form__th">사운드 재생</div>
								<div class="form__td">
									<div class="c-set__radio--txt-02">
										<label><input type="radio" name="gameset-03" checked><span>예</span></label>
										<label><input type="radio" name="gameset-03"><span>아니오</span></label>
									</div>
									<!-- //c-set__radio--txt-02-->
								</div>
							</div>
							<!-- //form__tr -->
						</div>
						<!-- //form__group -->
					</div>
					<!-- //c-board__write-02 -->

					<div class="solrobot-game--wrap">

						<div class="solrobot-game">

							<div class="solrobot-game__img">
								<img src="../../images/contents/solrobot/imgf101/4.jpg" alt="">
							</div>
							<!-- //solrobot-game__img -->

							<div class="c-solrobot-game__msg">
								<div class="inner">
									<div class="c-game__item txt">
										<dl>
											<dt>도담쌤 :</dt>
											<dd>
												우선 학교에서 나만 혼자인 것 같아서 외롭기도 하고 두렵기도 한 내 마음을 대나무숲에 속 시원히 한번 털어놓아볼까요?
											</dd>
										</dl>
									</div>
									<!-- //c-game__item -->

									<div class="c-game__item box">
										Q. 답답했던 내 마음을 속시원하게 털어놓아보세요.
									</div>
									<!-- //c-game__item -->

									<div class="c-game__item">
										<textarea name="" id="" cols="30" rows="10"></textarea>
									</div>
									<!-- //c-game__item -->

									<div class="c-game__item box">
										<ul>
											<li>
												<label>
													<input type="checkbox" name="form-game">
													<span>반에서 인기 있는 친구를 관찰하며 그 친구의 인기비결 알아보기</span>
												</label>
											</li>
											<li>
												<label>
													<input type="checkbox" name="form-game">
													<span>믿을만한 사람에게 나와 가까워지기 어려운 이유 물어보기</span>
												</label>
											</li>
											<li>
												<label>
													<input type="checkbox" name="form-game">
													<span>친구들 사이에서 유행하는 소재에 관심 가져보기 (예. 인기 TV프로그램 시청해보기)</span>
												</label>
											</li>
											<li>
												<label>
													<input type="checkbox" name="form-game">
													<span>나랑 비슷한 관심사를  가지고 있는 친구를 찾아서 먼저 말 걸어보기</span>
												</label>
											</li>
											<li>
												<label>
													<input type="checkbox" name="form-game">
													<span>친구들이 흥미를 가질 만한 나만의 매력 개발하기</span>
												</label>
											</li>
											<li>
												<label>
													<input type="checkbox" name="form-game">
													<span>밝은 표정으로 친구들 대하기</span>
												</label>
											</li>
											<li>
												<label>
													<input type="checkbox" name="form-game">
													<span>친구의 이야기를 잘 들어주고 맞장구쳐주기</span>
												</label>
											</li>
											<li>
												<label>
													<input type="checkbox" name="form-game">
													<span>친구의 변화를 알아차리고 칭찬해주기</span>
												</label>
											</li>
											<li>
												<label>
													<input type="checkbox" name="form-game">
													<span>기타</span>
												</label>
												<input type="text" class="txt">
											</li>
										</ul>
									</div>
									<!-- //c-game__item -->

									<div class="c-btns">
										<button type="button" class="c-btn__dft btn--bd-bk bdr-8">다음 <i class="xi-hand-pointing"></i></button>
									</div>
									<!-- //c-btns -->
								</div>
								<!-- //inner -->
							</div>
							<!-- //c-solrobot-game__msg -->

						</div>
						<!-- //solrobot-game -->

					</div>
					<!-- //solrobot--wrap -->

				</div>
				<!-- //l-contents -->

			</div>
			<!-- //contents -->

		</div>
		<!-- //l-container--inner -->
	</div>
	<!-- //l-container -->

	<!-- footer -->
	<footer id="footer">
		<!-- /inc/inc_footer.html -->
	</footer>
	<!-- //footer -->

</div>
<!-- //wrap -->
</body>
</html>
