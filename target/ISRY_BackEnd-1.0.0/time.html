<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>시간 차</title>
<script type="text/javascript">
async function getClockDrift() {

  // 인터넷 시간 가져오기 (UTC 기준)
  //const response = await fetch('http://worldtimeapi.org/api/ip');
  const response = await fetch('/worldtimeapi.do');

  console.log("response", response);
  
  const data = await response.json();

  console.log("data", data);

  // 브라우저 시스템 시간
  const localTime = new Date();

  //const rawDateTime = data.dateTime;

  //console.log("rawDateTime", rawDateTime);
  
  //const cleanedDateTime = rawDateTime;//String(rawDateTime).replace(/(\.\d{3})\d+/, '$1');

  //console.log("cleanedDateTime", cleanedDateTime);
  
  // API 가 제공하는 시간
  //const serverTime = new Date(data.utc_datetime);
  //const serverTime = new Date(data.datetime);
  const serverTime = new Date(data.dateTime);
  
  console.log("serverTime", serverTime);
  
  // 시간 차이 계산 (밀리초 단위)
  const driftMs = localTime.getTime() - serverTime.getTime();
  const driftSec = (driftMs / 1000).toFixed(3);

  console.log("driftMs", driftMs);
  console.log("driftSec", driftSec);
  
  console.log(`🕒 브라우저 시간: ${localTime.toISOString()} (로컬 시각)`);
  console.log(`🌐 실제 시간 (KST): ${serverTime.toISOString()}`);
  console.log(`📏 시간 차이: ${driftMs}ms (${driftSec}초)`);

  return driftMs;
}

getClockDrift();

</script>
</head>

</body>
</html>
